<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#1E50FF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#0B1021"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Logo Emblem Symbol -->
  <g transform="translate(64, 64)">
    <path d="M 60,320 Q 40,180 140,90 C 220,20 320,60 330,140 Q 340,210 240,220 Q 170,225 150,310 Z" 
          fill="url(#goldGrad)"/>
    <path d="M 130,120 L 190,120 L 190,280 L 320,280 L 320,330 L 130,330 Z" 
          fill="url(#blueGrad)"/>
    <path d="M 90,290 C 120,150 240,70 340,110" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
